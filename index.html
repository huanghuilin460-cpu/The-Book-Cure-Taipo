<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解憂舊書店 The Book Cure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* 復古書店主題色調：淺色與深色模式變數 */
        :root {
            --bg-color: #fdfbf7;
            --text-color: #3c3530;
            --header-bg: #e8ddcb;
            --card-bg: #ffffff;
            --btn-bg: #8c6b5d;
            --btn-hover: #70554a;
            --border-color: #d1c7b8;
            --highlight-bg: #f5f0e6;
        }
        .dark-mode {
            --bg-color: #2c2621;
            --text-color: #e0d5c1;
            --header-bg: #3a332d;
            --card-bg: #3d352e;
            --btn-bg: #b59a8c;
            --btn-hover: #9c8477;
            --border-color: #4a423b;
            --highlight-bg: #453c35;
        }
        
        /* 全域縮放設定 */
        html {
            font-size: 16px;
            transition: font-size 0.3s ease;
        }
        html.large-text-mode {
            font-size: 20px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }
        .header-custom { background-color: var(--header-bg); }
        .card-custom { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .highlight-custom { background-color: var(--highlight-bg); }
        .btn-custom { background-color: var(--btn-bg); color: #fff; }
        .btn-custom:hover { background-color: var(--btn-hover); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導航欄 -->
    <header class="header-custom p-4 shadow-sm flex flex-wrap justify-between items-center transition-colors duration-300">
        <div class="flex items-center space-x-3 mb-3 sm:mb-0">
            <h1 class="text-2xl font-bold tracking-wider" id="site-title">解憂舊書店</h1>
            <span class="text-sm opacity-80 border-l border-current pl-3">The Book Cure</span>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
            <button onclick="toggleTheme()" class="px-3 py-1.5 bg-black/10 rounded hover:bg-black/20 transition text-sm font-medium" id="btn-theme">切換深色</button>
            <button onclick="toggleFontSize()" class="px-3 py-1.5 bg-black/10 rounded hover:bg-black/20 transition text-sm font-medium" id="btn-font">放大文字</button>
            <select onchange="changeLanguage(this.value)" class="px-2 py-1.5 bg-transparent border border-current rounded text-sm outline-none cursor-pointer">
                <option value="zh-tw" class="text-black">繁體中文</option>
                <option value="zh-cn" class="text-black">简体中文</option>
                <option value="en" class="text-black">English</option>
            </select>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow container mx-auto px-4 py-10 max-w-3xl flex flex-col justify-center">
        <!-- 傾訴區塊 -->
        <div class="card-custom rounded-xl p-8 mb-8 text-center transition-colors duration-300">
            <h2 class="text-2xl font-semibold mb-6" id="prompt-title">告訴我你的煩惱，讓我為你推薦一本書</h2>
            <textarea id="user-input" class="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700/50 bg-transparent text-inherit resize-none" style="border-color: var(--border-color);" rows="4" placeholder="請在此傾訴你的感受與現況..."></textarea>
            <button onclick="recommendBook()" class="btn-custom mt-6 px-8 py-3 rounded-full font-medium transition w-full sm:w-auto shadow-md text-lg" id="btn-recommend">尋找解藥</button>
        </div>

        <!-- 讀取狀態 -->
        <div id="loading" class="text-center hidden py-8">
            <p class="animate-pulse font-semibold text-lg" style="color: var(--btn-bg);" id="loading-text">正在為您翻閱書單，尋找合適的解藥...</p>
        </div>

        <!-- 結果顯示區 -->
        <div id="result-section" class="hidden transform transition-all duration-500">
            <div class="card-custom rounded-xl p-8 border-t-4" style="border-top-color: var(--btn-bg);">
                <h3 class="text-lg font-bold mb-2 opacity-80" id="result-title">為您推薦的解藥：</h3>
                <div id="book-title" class="text-2xl sm:text-3xl font-bold mb-4 leading-snug"></div>
                
                <!-- 書中名句 -->
                <div class="mb-6 p-5 rounded-lg italic relative highlight-custom transition-colors duration-300">
                    <span class="absolute top-1 left-2 text-3xl opacity-20 font-serif">"</span>
                    <p id="book-quote" class="px-4 text-center leading-relaxed font-medium text-lg"></p>
                    <span class="absolute bottom-[-15px] right-2 text-3xl opacity-20 font-serif">"</span>
                </div>

                <!-- 推薦理由 -->
                <div class="mb-5">
                    <h4 class="font-bold flex items-center gap-2 mb-2 text-lg" style="color: var(--btn-bg);">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span id="reason-title">為何推薦這本書？</span>
                    </h4>
                    <p id="book-reason" class="leading-relaxed opacity-90"></p>
                </div>

                <!-- 書本簡介 -->
                <div class="mb-6 pb-6 border-b" style="border-color: var(--border-color);">
                    <h4 class="font-bold flex items-center gap-2 mb-2 text-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                        <span id="desc-title">書本簡介</span>
                    </h4>
                    <p id="book-desc" class="leading-relaxed opacity-90"></p>
                </div>

                <div class="text-center">
                    <a id="book-link" href="#" target="_blank" class="btn-custom inline-block px-6 py-3 rounded shadow hover:shadow-md transition font-medium text-lg">前往查看詳細資訊與購書 →</a>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="header-custom p-8 text-center mt-auto transition-colors duration-300">
        <div class="max-w-2xl mx-auto flex flex-col items-center space-y-3 opacity-90">
            <h2 class="font-bold text-xl tracking-wide" id="footer-title">解憂舊書店 The Book Cure</h2>
            <p class="flex items-center gap-2 text-sm sm:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                <span id="footer-address">寶湖道街市地下F21, 新界, 大埔區, 香港</span>
            </p>
            <p class="flex items-center gap-2 text-sm sm:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span id="footer-hours">營業時間：星期一至日 11:30～20:00</span>
            </p>
        </div>
    </footer>

    <script>

        const i18n = {

                'quotes': [
                    "閱讀是一座隨身攜帶的避難所。",
                    "有些煩惱，翻開書頁就能找到答案。",
                    "書本無法為你解決所有問題，但能給你面對問題的勇氣。",
                    "這本書裡，或許正藏著你此刻最需要的解藥。"
                ],
                'reasons': [
                    "從你的文字中，我感受到了你目前的迷惘。這本書的作者曾經歷過類似的掙扎，書中的觀點或許能為你提供一個全新的視角，幫助你梳理思緒。",

                ]
            },
            'zh-cn': {
                'site-title': '解忧旧书店',

                'btn-theme-light': '切换浅色',
                'btn-font': '放大文字',
                'btn-font-normal': '默认文字',
                'prompt-title': '告诉我你的烦恼，让我为你推荐一本书',
                'placeholder': '请在此倾诉你的感受与现况...',
                'btn-recommend': '寻找解药',
                'result-title': '为您开出的专属解药：',
                'reason-title': '为何推荐这本书？',
                'desc-title': '书本简介',
                'link-text': '前往查看详细资讯与购书 →',
                'loading-text': '正在为您翻阅书单，寻找合适的解药...',
                'footer-title': '解忧旧书店 The Book Cure',
                'footer-address': '宝湖道街市地下F21, 新界, 大埔区, 香港',
                'footer-hours': '营业时间：星期一至日 11:30～20:00',
                'error-empty': '请输入一些文字，让我能为你寻找解答。',
                'error-load': '无法加载书单。请确保 thebookcure_all_books_1431.xlsx 文件已经上传。',
                'fallback-desc': '此书目前暂无文字简介，请点击下方链接前往书店网站查看详细内容。',
                'quotes': [
                    "阅读是一座随身携带的避难所。",
                    "有些烦恼，翻开书页就能找到答案。",
                    "书本无法为你解决所有问题，但能给你面对问题的勇气。",
                    "这本书里，或许正藏着你此刻最需要的解药。"
                ],
                'reasons': [
                    "从你的文字中，我感受到了你目前的迷惘。这本书的作者曾经历过类似的挣扎，书中的观点或许能为你提供一个全新的视角，帮助你梳理思绪。",
                    "面对目前的处境，你需要的是一股安定的力量。这本书的文字温润而充满智慧，它不会说教，而是静静地陪你走过这段情绪的低谷。",
                    "你的烦恼源于对未知的焦虑与对完美的追求。这本书正好探讨了如何放下执念，找回内心的平静，相信它能成为你此刻的最佳陪伴。",
                    "有时候，跳脱出现在框架是最好的解药。这本书构筑的世界观与你所处的现实截然不同，它能带你进行一场短暂的思想旅行，让疲惫的心灵获得喘息。"
                ]
            },
            'en': {
                'site-title': 'The Book Cure',
                'btn-theme': 'Dark Mode',
                'btn-theme-light': 'Light Mode',
                'btn-font': 'Larger Text',
                'btn-font-normal': 'Normal Text',
                'prompt-title': 'Tell me your worries, let me recommend a book',
                'placeholder': 'Pour your heart out here...',
                'btn-recommend': 'Find My Cure',
                'result-title': 'Your Prescribed Cure:',
                'reason-title': 'Why this book?',
                'desc-title': 'Synopsis',
                'link-text': 'View Details & Purchase →',
                'loading-text': 'Browsing the shelves to find your cure...',
                'footer-title': 'The Book Cure',
                'footer-address': 'Shop F21, G/F, Plover Cove Road Market, Tai Po, N.T., HK',
                'footer-hours': 'Opening Hours: Mon-Sun 11:30 - 20:00',
                'error-empty': 'Please type something so I can find a cure for you.',
                'error-load': 'Cannot load the book list. Make sure the excel file is uploaded.',
                'fallback-desc': 'There is no synopsis available right now. Please click the link below to read more on our website.',
                'quotes': [
                    "Reading is a refuge you can carry with you.",
                    "Some worries find their answers in the pages of a book.",
                    "Books might not solve everything, but they give you courage.",
                    "Perhaps the cure you need right now is hidden in this book."
                ],
                'reasons': [
                    "Reading your words, I sense a feeling of being lost. The author of this book went through similar struggles, and their perspective might give you the clarity you need.",
                    "In your current situation, you need a grounding force. This book offers wisdom and warmth without being preachy, walking beside you through this valley.",
                    "Your concerns seem rooted in the anxiety of the unknown. This book is the perfect companion for learning how to let go and rediscover your inner peace.",
                    "Sometimes the best cure is to step outside your current reality. This book offers a completely different world, giving your tired mind a much-needed brief escape."
                ]
            }
        };

        window.onload = async () => {
            // 初始化 UI 文字，避免一開始按鈕是空白的
            updateUI();
            
            try {
                const response = await fetch('thebookcure_all_books_1431.xlsx');
                if (!response.ok) throw new Error("File not found");
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                books = jsonData.map(row => ({
                    id: row['序號'],
                    title: row['書名'],
                    url: row['網址'],
                    quote: row['名句'], 
                    description: row['簡介'], 
                    reason: row['推薦理由']
                })).filter(b => b.title);
                
            } catch (error) {
                console.error("讀取 Excel 失敗:", error);
            }
        };

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            updateUI();
        }

        function toggleFontSize() {
            isLargeText = !isLargeText;
            document.documentElement.classList.toggle('large-text-mode', isLargeText);
            updateUI();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            updateUI();
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('site-title').innerText = t['site-title'];
            document.getElementById('btn-theme').innerText = isDarkMode ? t['btn-theme-light'] : t['btn-theme'];
            document.getElementById('btn-font').innerText = isLargeText ? t['btn-font-normal'] : t['btn-font'];
            document.getElementById('prompt-title').innerText = t['prompt-title'];
            document.getElementById('user-input').placeholder = t['placeholder'];
            document.getElementById('btn-recommend').innerText = t['btn-recommend'];
            document.getElementById('result-title').innerText = t['result-title'];
            document.getElementById('reason-title').innerText = t['reason-title'];
            document.getElementById('desc-title').innerText = t['desc-title'];
            document.getElementById('book-link').innerText = t['link-text'];
            document.getElementById('loading-text').innerText = t['loading-text'];
            document.getElementById('footer-title').innerText = t['footer-title'];
            document.getElementById('footer-address').innerText = t['footer-address'];
            document.getElementById('footer-hours').innerText = t['footer-hours'];
        }

        function recommendBook() {
            const input = document.getElementById('user-input').value.trim();
            if (!input) { alert(i18n[currentLang]['error-empty']); return; }
            if (books.length === 0) { alert(i18n[currentLang]['error-load']); return; }

            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < input.length; i++) {
                    hash = input.charCodeAt(i) + ((hash << 5) - hash);
                }
                
                const bookIndex = Math.abs(hash) % books.length;
                const recBook = books[bookIndex];
                const t = i18n[currentLang];

                const quoteIndex = Math.abs(hash) % t['quotes'].length;
                const finalQuote = recBook.quote ? recBook.quote : t['quotes'][quoteIndex];
                
                const reasonIndex = Math.abs(hash) % t['reasons'].length;
                const finalReason = recBook.reason ? recBook.reason : t['reasons'][reasonIndex];

                const finalDesc = recBook.description ? recBook.description : t['fallback-desc'];
                
                document.getElementById('book-title').innerText = recBook.title;
                document.getElementById('book-link').href = recBook.url;
                document.getElementById('book-quote').innerText = finalQuote;
                document.getElementById('book-reason').innerText = finalReason;
                document.getElementById('book-desc').innerText = finalDesc;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
            }, 1200); 
        }
    </script>
</body>
</html>
